<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisLink - Health Referral Routing</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Leaflet Routing Machine -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <style>
        /* The Magic Dark Mode Geographical Map Trick */
        .leaflet-tile {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
        /* Hide the ugly text instructions from the routing machine */
        .leaflet-routing-container {
            display: none !important;
        }
        /* Custom scrollbar for sidebar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-950 text-white flex h-screen overflow-hidden font-sans">

    <!-- Left Sidebar -->
    <div class="w-[400px] bg-[#0b1120] p-6 flex flex-col shadow-2xl z-10 overflow-y-auto border-r border-gray-800">
        <h1 class="text-2xl font-bold mb-8 tracking-wide">AegisLink Dispatch</h1>
        
        <div class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2 tracking-wider">PATIENT LATITUDE (CHENNAI)</label>
                <input type="number" id="patient-lat" value="13.0000" step="0.0001" class="w-full bg-[#111827] border border-gray-800 text-white rounded p-3 focus:outline-none focus:border-red-500 transition-colors">
            </div>
            
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2 tracking-wider">PATIENT LONGITUDE (CHENNAI)</label>
                <input type="number" id="patient-lon" value="80.2000" step="0.0001" class="w-full bg-[#111827] border border-gray-800 text-white rounded p-3 focus:outline-none focus:border-red-500 transition-colors">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2 tracking-wider">REQUIRED GENERAL BEDS</label>
                <input type="number" id="general-beds" value="0" min="0" class="w-full bg-[#111827] border border-gray-800 text-white rounded p-3 focus:outline-none focus:border-red-500 transition-colors">
            </div>
            
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2 tracking-wider">REQUIRED ICU BEDS</label>
                <input type="number" id="icu-beds" value="0" min="0" class="w-full bg-[#111827] border border-gray-800 text-white rounded p-3 focus:outline-none focus:border-red-500 transition-colors">
            </div>
            
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2 tracking-wider">REQUIRED VENTILATORS</label>
                <input type="number" id="ventilators" value="0" min="0" class="w-full bg-[#111827] border border-gray-800 text-white rounded p-3 focus:outline-none focus:border-red-500 transition-colors">
            </div>
            
            <!-- Dynamic Resources Container -->
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2 tracking-wider">REQUIRED CLINICAL RESOURCES</label>
                <div id="resources-container" class="space-y-2">
                    <input type="text" placeholder="e.g. Trauma Surgeon" class="w-full bg-[#111827] border border-gray-800 text-gray-300 rounded p-3 focus:outline-none focus:border-red-500 transition-colors">
                </div>
            </div>
        </div>

        <button id="find-route-btn" class="mt-8 w-full bg-[#dc2626] hover:bg-[#b91c1c] text-white font-bold py-3.5 px-4 rounded-lg shadow-lg shadow-red-900/50 transition-all active:scale-95">
            FIND OPTIMAL ROUTE
        </button>
        
        <div id="status-message" class="mt-4 text-sm text-center hidden"></div>

        <!-- Custom Match Panel -->
        <div id="results-panel" class="hidden mt-6 bg-[#0f292e] rounded-lg p-5 border border-[#1e4b4a]">
            <h2 class="text-white text-lg font-bold mb-3">Match Found!</h2>
            <p class="text-[#34d399] text-sm mb-1">Hospital: <span id="res-hospital"></span></p>
            <p class="text-[#34d399] text-sm mb-4">Available ICU Beds: <span id="res-icu"></span></p>
            
            <button id="dispatch-btn" class="w-full bg-[#34d399] hover:bg-[#10b981] text-gray-900 font-bold py-3 rounded text-sm mb-5 transition-colors active:scale-95">
                CONFIRM & DISPATCH
            </button>
            
            <p class="text-white text-sm font-bold mb-1">Est. Distance:</p>
            <p class="text-[#34d399] text-sm mb-3" id="res-dist">Calculating...</p>
            
            <p class="text-white text-sm font-bold mb-1">Est. Drive Time:</p>
            <p class="text-[#34d399] text-sm" id="res-time">Calculating...</p>
        </div>
    </div>

    <!-- Right Side Map -->
    <div id="map" class="flex-1 h-full z-0"></div>

    <script>
        // Dynamic Resource Inputs Logic
        const container = document.getElementById('resources-container');
        container.addEventListener('input', (e) => {
            const inputs = container.querySelectorAll('input');
            const lastInput = inputs[inputs.length - 1];
            
            if (e.target === lastInput && lastInput.value.trim() !== '') {
                const newInput = document.createElement('input');
                newInput.type = 'text';
                newInput.placeholder = 'Add another...';
                newInput.className = 'w-full bg-[#111827] border border-gray-800 text-gray-300 rounded p-3 focus:outline-none focus:border-red-500 transition-colors';
                container.appendChild(newInput);
            }
        });

        // Initialize Map
        const map = L.map('map').setView([13.0827, 80.2707], 12);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let patientMarker = L.marker([13.0000, 80.2000], { draggable: true }).addTo(map)
            .bindPopup("Ambulance Location").openPopup();

        patientMarker.on('dragend', function () {
            const latLng = patientMarker.getLatLng();
            document.getElementById('patient-lat').value = latLng.lat.toFixed(4);
            document.getElementById('patient-lon').value = latLng.lng.toFixed(4);
        });

        let routingControl = null;
        let hospitalMarker = null;
        let currentHospitalId = null;

        // Routing Logic
        document.getElementById('find-route-btn').addEventListener('click', async () => {
            const btn = document.getElementById('find-route-btn');
            const statusDiv = document.getElementById('status-message');
            const resultsPanel = document.getElementById('results-panel');
            
            const patientLat = parseFloat(document.getElementById('patient-lat').value) || 13.0000;
            const patientLon = parseFloat(document.getElementById('patient-lon').value) || 80.2000;
            const reqGen = parseInt(document.getElementById('general-beds').value) || 0;
            const reqIcu = parseInt(document.getElementById('icu-beds').value) || 0;
            const reqVent = parseInt(document.getElementById('ventilators').value) || 0;
            
            btn.innerText = "ANALYZING...";
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            statusDiv.className = "mt-4 text-sm text-center hidden";
            resultsPanel.classList.add('hidden');

            // CLEAR OLD ROUTES AND MARKERS COMPLETELY
            if (routingControl) {
                map.removeControl(routingControl);
                routingControl = null;
            }
            if (hospitalMarker) {
                map.removeLayer(hospitalMarker);
                hospitalMarker = null;
            }

            try {
                const backendUrl = 'https://aegis-health-routing.onrender.com';

                const response = await fetch(`${backendUrl}/optimize`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        patient_lat: patientLat,
                        patient_lon: patientLon,
                        required_general: reqGen,
                        required_icu: reqIcu,
                        required_vent: reqVent
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "No suitable hospital found.");
                }

                const hospital = data.optimal_hospital;
                const hLat = parseFloat(hospital.lat || hospital.latitude);
                const hLon = parseFloat(hospital.lon || hospital.longitude);
                currentHospitalId = hospital.id || hospital.hospital_id;

                document.getElementById('res-hospital').innerText = hospital.name;
                document.getElementById('res-icu').innerText = (hospital.capacity?.icu_beds || hospital.icu_beds || 0);
                resultsPanel.classList.remove('hidden');

                // Draw SINGLE Hospital Marker
                hospitalMarker = L.marker([hLat, hLon]).addTo(map).bindPopup("<b>" + hospital.name + "</b>").openPopup();

                // Draw Routing Line (NO DUPLICATE MARKERS)
                routingControl = L.Routing.control({
                    waypoints: [
                        L.latLng(patientLat, patientLon),
                        L.latLng(hLat, hLon)
                    ],
                    routeWhileDragging: false,
                    show: false, // Hides the text box
                    addWaypoints: false, // Prevents accidental clicks from adding points
                    createMarker: function() { return null; }, // THE MAGIC FIX: Prevents duplicate Leaflet markers
                    lineOptions: {
                        styles: [{color: '#3b82f6', opacity: 0.8, weight: 6}]
                    }
                }).addTo(map);

                routingControl.on('routesfound', function(e) {
                    const routes = e.routes;
                    const summary = routes[0].summary;
                    document.getElementById('res-dist').innerText = (summary.totalDistance / 1000).toFixed(1) + " km";
                    document.getElementById('res-time').innerText = Math.round(summary.totalTime / 60) + " mins";
                });

            } catch (error) {
                let msg = error.message;
                if (msg.includes('Failed to fetch')) {
                    msg = "Network Error: Render backend is waking up. This takes ~50 seconds on the free tier. Please wait and click again!";
                }
                statusDiv.innerText = msg;
                statusDiv.className = "mt-4 text-sm text-center text-red-400 block";
            } finally {
                btn.innerText = "FIND OPTIMAL ROUTE";
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        });

        // Dispatch Logic
        document.getElementById('dispatch-btn').addEventListener('click', async () => {
            const reqGen = parseInt(document.getElementById('general-beds').value) || 0;
            const reqIcu = parseInt(document.getElementById('icu-beds').value) || 0;
            const reqVent = parseInt(document.getElementById('ventilators').value) || 0;
            
            try {
                const response = await fetch('https://aegis-health-routing.onrender.com/route', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        hospital_id: currentHospitalId,
                        general_count: reqGen,
                        icu_count: reqIcu,
                        ventilator_count: reqVent
                    })
                });
                
                if (response.ok) {
                    alert("Ambulance Dispatched! Hospital database updated successfully.");
                } else {
                    alert("Database deduction failed. Check backend logs.");
                }
            } catch (err) {
                alert("Network error: Could not connect to backend.");
            }
        });
    </script>
</body>
</html>
